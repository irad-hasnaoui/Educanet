<section>
    <h2>Convert Text Document to Number</h2>
    <input type="file" accept=".txt" (change)="onFileSelected($event)" />
    <div ngIf="error" style="color: red;">{{ error }}</div>
    <div ngIf="numberValue !== null">
      <p>Converted number: <strong>{{ numberValue }}</strong></p>
    </div>
  </section>
